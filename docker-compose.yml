services:
  mysql:
    image: mysql:8.0
    container_name: myshop-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: myshop_manager

    ports:
      - "3307:3306"

    volumes:
      - myshop-mysql-data:/var/lib/mysql

  # Dedicated Postgres instance for the new Media bounded context (myshop-media-service /
  # myshop-media-worker). Deliberately NOT shared with the MySQL instance above, per
  # docs/architecture/01-current-state-assessment.md §4 (Option A: new services keep their own
  # schema/engine rather than forcing Open4Talk's data model onto MySQL/MyBatis-Plus).
  media-postgres:
    image: postgres:16-alpine
    container_name: myshop-media-postgres

    environment:
      POSTGRES_DB: myshop_media
      POSTGRES_USER: myshop_media
      POSTGRES_PASSWORD: myshop_media

    ports:
      - "5433:5432"

    volumes:
      - myshop-media-postgres-data:/var/lib/postgresql/data

  # RabbitMQ for Media ingestion events (MediaIngestionRequested/Completed/Failed) — see
  # docs/architecture/05-technology-stack-decisions.md ("Messaging: RabbitMQ").
  media-rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: myshop-media-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: myshop
      RABBITMQ_DEFAULT_PASS: myshop

    ports:
      - "5673:5672"
      - "15673:15672"

    volumes:
      - myshop-media-rabbitmq-data:/var/lib/rabbitmq

  prometheus:
    image: prom/prometheus:latest
    container_name: myshop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter:latest
    container_name: myshop-node-exporter
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  grafana:
    image: grafana/grafana:latest
    container_name: myshop-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

volumes:
  myshop-mysql-data:
  myshop-media-postgres-data:
  myshop-media-rabbitmq-data:
  prometheus-data:
  grafana-data:
