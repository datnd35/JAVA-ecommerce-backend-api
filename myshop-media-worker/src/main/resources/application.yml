server:
  port: 8082

spring:
  application:
    name: myshop-media-worker

  datasource:
    url: jdbc:postgresql://localhost:5433/myshop_media
    username: myshop_media
    password: myshop_media
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Phase 1 scaffolding convenience only — same caveat as myshop-media-service; this worker
      # shares the Media schema and must adopt the same migration tool once introduced.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  rabbitmq:
    host: localhost
    port: 5673
    username: myshop
    password: myshop
    listener:
      simple:
        # Bounded redelivery at the broker level too (defense in depth on top of the
        # persisted attemptCount cap enforced in MediaIngestionConsumer).
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: myshop-media-worker
